{{- if .Values.enabled -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ph-ee-connector-ams-mifos
  labels:
    app: ph-ee-connector-ams-mifos
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: ph-ee-connector-ams-mifos
  template:
    metadata:
      labels:
        app: ph-ee-connector-ams-mifos
      annotations:
        {{- if .Values.deployment.annotations }}
        {{ toYaml .Values.deployment.annotations | indent 8 }}
        {{- end }}
    spec:
      {{- if .Values.deployment.affinity }}
      affinity:
        {{- toYaml .Values.deployment.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.deployment.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if or .Values.tolerations .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml ( .Values.tolerations | default .Values.deployment.tolerations ) | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      serviceAccountName: ph-ee-connector-ams-mifos
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriod }}

      containers:
        - name: ph-ee-connector-ams-mifos
          image: "{{ .Values.image }}"
          imagePullPolicy: "{{ .Values.imagePullPolicy }}"
          ports:
            - containerPort: 5000
          env:
            - name: "SPRING_PROFILES_ACTIVE"
              value: "{{ .Values.SPRING_PROFILES_ACTIVE }}"
            - name: "ams_local_enabled"
              value: "{{ .Values.ams_local_enabled }}"
            - name: "ams_local_interop_host"
              value: "{{ .Values.ams_local_interop_host }}"
            - name: "ams_local_customer_host"
              value: "{{ .Values.ams_local_customer_host }}"
            - name: "ams_local_account_host"
              value: "{{ .Values.ams_local_account_host }}"
            - name: "ams_local_auth_host"
              value: "{{ .Values.ams_local_auth_host }}"
            - name: "ams_local_loan_host"
              value: "{{ .Values.ams_local_loan_host }}"
            - name: "DFSPIDS"
              value: "{{ .Values.global.DFSPIDS }}"
            - name: "ZEEBE_BROKER_CONTACTPOINT"
              value: "{{ .Release.Name }}-zeebe-gateway:26500"
            - name: "ZEEBE_CLIENT_MAX-EXECUTION-THREADS"
              value: "{{ .Values.global.max_execution_threads }}"
            - name: "ZEEBE_CLIENT_POLL-INTERVAL"
              value: "{{ .Values.global.poll_interval }}"
            {{- if .Values.extraEnvs | default .Values.deployment.extraEnvs }}
            {{ toYaml ( .Values.extraEnvs | default .Values.deployment.extraEnvs ) | nindent 12 }}
            {{- end }}
          {{- if .Values.envFrom | default .Values.deployment.envFrom }}
          envFrom:
            {{ toYaml ( .Values.envFrom | default .Values.deployment.envFrom ) | nindent 12 }}
          {{- end }}
          {{- if or .Values.podSecurityContext .Values.deployment.securityContext }}
          securityContext:
            {{ toYaml ( .Values.podSecurityContext | default .Values.deployment.securityContext ) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: ph-ee-config
              mountPath: "/config"
            - name: tls-volume
              mountPath: /tls # Mount for TLS keystore generated by init container
{{- if .Values.deployment.extraVolumeMounts }}
{{ toYaml .Values.deployment.extraVolumeMounts | nindent 12 }}
{{- end }}
          # {{- if .Values.deployment.config }}
          # {{ toYaml .Values.deployment.config | indent 12 }}
          # {{- end }}
      # --- BEGIN Init Container ---
      initContainers:
        - name: create-tls-keystore
          image: eclipse-temurin:17
          command: ['sh', '-c']
          args:
            - |
              echo "Creating TLS keystore for AMS connector..."
              keytool -genkeypair -alias ams-mifos -keyalg RSA -keysize 2048 \
                -storetype PKCS12 -keystore /tls/keystore.p12 \
                -storepass changeit -keypass changeit -validity 3650 \
                -dname "CN=ams-mifos, OU=PaymentHub, O=Mifos, L=City, ST=State, C=US" 2>&1
              echo "Keystore created successfully:"
              ls -la /tls/
          volumeMounts:
            - name: tls-volume
              mountPath: /tls
        - name: wait-for-gateway
          image: curlimages/curl:latest
          command: ['sh', '-c']
          args:
            - |
              GATEWAY_HEALTH_URL="http://phee-zeebe-gateway:9600/actuator/health/liveness"
              echo "Waiting for Zeebe Gateway liveness check on $GATEWAY_HEALTH_URL..."
              until curl -s $GATEWAY_HEALTH_URL | grep -q '"status":"UP"'; do
                echo "Gateway not yet fully ready..."
                sleep 2
              done
              echo "Gateway is fully up! Proceeding to main container..."
        - name: wait-db
          image: busybox:1.35
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for database connection..."
              until nc -z {{ .Values.operations_app.datasource.host }} 3306; do
                echo "Database not ready, waiting..."
                sleep 2
              done
              echo "Database is ready!"
      # --- END Init Container ---
      volumes:
        - name: ph-ee-config
          configMap:
            name: ph-ee-config
        - name: tls-volume
          emptyDir: {} # Temporary volume for TLS keystore created by init container
{{- if .Values.deployment.extraVolumes }}
{{ toYaml .Values.deployment.extraVolumes | nindent 8 }}
{{- end }}
      {{- if .Values.extraContainers }}
      {{ tpl .Values.extraContainers . | indent 6 }}
      {{- end }}
      imagePullSecrets:
        {{ toYaml .Values.imagePullSecrets | indent 8 }}
{{- end }}
