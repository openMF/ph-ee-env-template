{{- if .Values.enabled -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ph-ee-zeebe-ops
  labels:
    app: ph-ee-zeebe-ops
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: ph-ee-zeebe-ops
  template:
    metadata:
      labels:
        app: ph-ee-zeebe-ops
      annotations:
{{- if .Values.deployment.annotations }}
{{ toYaml .Values.deployment.annotations | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: ph-ee-zeebe-ops
          image: "{{ .Values.image }}"
          imagePullPolicy: "{{ .Values.imagePullPolicy }}"
          resources:
            limits:
              memory: "{{ .Values.limits.memory }}"
              cpu: "{{ .Values.limits.cpu }}"
            requests:
              memory: "{{ .Values.requests.memory }}"
              cpu: "{{ .Values.requests.cpu }}"
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path | default "/actuator/health/liveness" }}
              port: {{ .Values.livenessProbe.port | default 8080}}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path | default "/actuator/health/readiness" }}
              port: {{ .Values.readinessProbe.port | default 8080 }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 30 }}
          env:
            - name: "ZEEBE_BROKER_CONTACTPOINT"
              value: "{{ .Release.Name }}-zeebe-gateway:26500"
            - name: "TENANTS"
              value: "{{ .Values.global.tenants }}"
            - name: "DFSPIDS"
              value: "{{ .Values.global.DFSPIDS }}"           
            - name: "elasticsearch_url"
              value: "{{ .Values.elasticsearch_url }}"
            - name: "LOGGING_LEVEL_ROOT"
              value:  "{{ .Values.global.LOGGING_LEVEL_ROOT }}"
            - name: "SPRING_DATA_ELASTICSEARCH_CLIENT_REACTIVE_ENDPOINTS"
              value: "{{ .Values.elasticsearch_contactpoint }}"
            - name: "ELASTICSEARCH_SECURITY_ENABLED"
              value: "{{ .Values.elasticsearch_security_enabled }}"
            - name: "ELASTICSEARCH_SSLVERIFICATION"
              value: "{{ .Values.elasticsearch_sslverification }}"
            - name: "ELASTICSEARCH_USERNAME"
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: username
            - name: "ELASTICSEARCH_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
{{- if .Values.extraEnvs | default .Values.deployment.extraEnvs }}
{{ toYaml ( .Values.extraEnvs | default .Values.deployment.extraEnvs ) | indent 12 }}
{{- end }}        
          envFrom: {{ toYaml ( .Values.envFrom | default .Values.deployment.envFrom ) | nindent 12 }}
          securityContext: {{ toYaml ( .Values.podSecurityContext | default .Values.deployment.securityContext ) | nindent 12 }}              

      #     volumeMounts:
      #       - name: ph-ee-config
      #         mountPath: "/config"
      #       - name: local-code
      #         mountPath: /app # Mount your local code into /app in the container
      #     command: ["java", "-jar", "/app/build/libs/ph-ee-zeebe-ops-0.0.1-SNAPSHOT.jar"] # replace ph-ee-connector-bulk-0.0.1-SNAPSHOT.jar with your jar file name
      # volumes:
      #   - name: ph-ee-config
      #     configMap:
      #       name: ph-ee-config
      #   - name: local-code
      #     hostPath:
      #       path: /home/mifosu/ph-ee-zeebe-ops # local project path
      #       type: Directory # Ensure it's a directory 

{{- end }}
