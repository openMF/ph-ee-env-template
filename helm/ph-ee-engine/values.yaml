  elasticsearch:
    enabled: false
    #Single Node Solution
    clusterHealthCheckParams: "wait_for_status=yellow&timeout=100s"
    protocol: http
    master:
      readinessProbe:
        httpGet:
          allow-insecure: true
          username: elastic
          password: "{{ .Env.ELASTIC_PASSWORD }}"
          path: /_cluster/health?wait_for_status=yellow&timeout=5s
          port: 9200
        initialDelaySeconds: 30
    data:
      readinessProbe:
        httpGet:
          allow-insecure: true
          username: elastic
          password: "{{ .Env.ELASTIC_PASSWORD }}"
          path: /_cluster/health?wait_for_status=yellow&timeout=5s
          port: 9200
        initialDelaySeconds: 30
    # Shrink default JVM heap.
    esJavaOpts: "-Xmx128m -Xms512m"
    # Allocate smaller chunks of memory per pod.
    resources:
      requests:
        cpu: "100m"
        memory: "128M"
      limits:
        cpu: "1000m"
        memory: "256M"
    volumeClaimTemplate:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 1Gi
    ingress:
      enabled: false
      className: nginx
      pathtype: ImplementationSpecific
      hosts:
        - host: elastic-phee.mifos.gazelle.test
          paths:
            - path: /    

  kibana:
    enabled: false
    readinessProbe:
      initialDelaySeconds: 45
      timeoutSeconds: 15
      successThreshold: 1    
    protocol: http
    ingress:
      enabled: false
      className: "nginx"
      pathtype: ImplementationSpecific
      annotations: {
        kubernetes.io/ingress.class: nginx
        # kubernetes.io/tls-acme: "true" 
      }      
      hosts:
        - host: kibana-phee.mifos.gazelle.test
          paths:
            - path: /
      #tls: []
      #  - secretName: chart-example-tls
      #    hosts:
      #      - chart-example.mifos.gazelle.test

channel:
  enabled: true
  replicas: 1
  image: docker.io/openmf/ph-ee-connector-channel:v1.11.0-gazelle-1.1.0
  imagePullPolicy: IfNotPresent
  hostname: "channel.mifos.gazelle.test"
  stub_hostname: "channel-gsma.mifos.gazelle.test"
  #SPRING_PROFILES_ACTIVE: "bb,tenants"q
  TRANSACTION_ID_LENGTH: 20
  gsma_payee_tenant: ""
  redis:
    host: "127.0.0.1"
    port: 6379
    password: ""
    idempotency:
      enabled: true
      keyFormat: "clientCorrelationId_tenant_api"
      apiList: "/channel/transfer,/channel/collection,/channel/gsma/transaction,/channel/transactionRequest"
  operations:
    url: "http://ph-ee-operations-app:80/api/v1"
    authEnabled: false
  tenantPrimary:
    clientId: ""
    clientSecret: ""
    tenant: ""
  tenantSecondary:
    clientId: ""
    clientSecret: ""
    tenant: ""
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
      scheme: HTTPS 
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5 
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
      scheme: HTTPS
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
  managedServiceAccount: true 
  serviceAccount: "channel" 
  serviceAccountAnnotations: {} 
  terminationGracePeriod: 30 
# Extra environment variables for channel container.
  envFrom: [] 
  # - configMapRef:
  #     name: config-secret
  extraEnvs: []
  priorityClassName: "" 
  securityContext:
    runAsUser: 0
    privileged: false
  limits:
    memory: "512M"
    cpu: "500m"
  requests:
    memory: "128k"
    cpu: "50m"
  service:
    annotations: {}  
  ingress:
    enabled: true
    className: nginx
    # tls:
    #   - secretName: sandbox-secret
    hosts:
      - host: channel.mifos.gazelle.test          
        paths: 
        - path: "/"
          backend:
            service:
              name: ph-ee-connector-channel
              port:
                number: 8443
      - host: channel-gsma.mifos.gazelle.test          
        paths:          
        - path: "/"
          backend:
            service:
              name: "ph-ee-connector-channel-gsma"
              port:
                number: 82 
  deployment:
    annotations:
        deployTime: "{{ .Values.deployTime }}"
    affinity: {}
    nodeSelector: {}
    tolerations: []
    envFrom: []
  # - configMapRef:
  #     name: config-secret
    extraEnvs: []
  # - User that the container will execute as.
  # Not necessary to run as root (0) as the channel Deployment use cases do not need access to Kubernetes Node internals
  # - Typically not necessarily unless running within environments such as OpenShift.
    securityContext:
      runAsUser: 0
      privileged: false
    limits:
        memory: "512M"
        cpu: "500m"
    requests:
      memory: "128k"
      cpu: "50m"
# Allows you to add any config files in /usr/share/
    # such as ph-ee-connector-channel.yml for deployment  
    # ph-ee-connector-channelConfig: {}
    #   ph-ee-connector-channel.yml: |        

