# FIN12 / AMS (Account Management System) configuration
# Used by: connector-ams-mifos

# Enable locale support in AMS
ams.locale.enabled=true

# Zeebe broker connection
zeebe.broker.contactpoint={{ .Release.Name }}-zeebe-gateway:26500

# DFSP IDs for AMS connector
# greenbank = Mojaloop payer, redbank = closedloop payer, bluebank = payee
gazelle.ph-ee-engine.ph_ee_connector_ams_mifos.dfspids=greenbank,redbank,bluebank
