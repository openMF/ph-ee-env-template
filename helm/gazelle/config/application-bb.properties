# Building Block mode configuration
# Used by: connector-mojaloop, connector-channel

# DFSP IDs for Zeebe worker registration
# greenbank = Mojaloop payer, redbank = closedloop payer, bluebank = payee
dfspids=greenbank, redbank, bluebank

# Zeebe broker connection
zeebe.broker.contactpoint={{ .Release.Name }}-zeebe-gateway:26500

# I think these are unused 
# # Fineract (FRED) hosts for core banking integration
# store.local.interop.host=https://FREDrhino.mifos.gazelle.test
# store.local.customer.host=https://FREDrhino.mifos.gazelle.test

# OAuth2 security configuration
security.oauth2.resource.jwt.key-uri=http://ops-bk.mifos.gazelle.test/oauth/token_key

# REST authorization
rest.authorization.enabled=false
rest.authorization.host=http://ops-bk.mifos.gazelle.test
