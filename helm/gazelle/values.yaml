ph-ee-engine:
  ingress:
    apiversion: "networking.k8s.io/v1"

  deployment:
    apiversion: "apps/v1"

  service:
    apiversion: "v1"

  secret:
    apiversion: "v1"

  configmap:
    apiversion: "v1"

  global:
    SPRING_PROFILES_ACTIVE: "bb"
    imagePullPolicy: "Always"
    LOGGING_LEVEL_ROOT: "INFO"
    LOGGING_PATTERN_CONSOLE: "%d{dd-MM-yyyy HH:mm:ss.SSS} %magenta([%thread]) %highlight(%-5level) %logger.%M - %msg%n"
    tenants: "greenbank,bluebank"
    DFSPIDS: "greenbank,bluebank"

  zeebe-operate-helm:
    enabled: true
    image:
      repository: camunda/operate
      tag: 1.1.0
    global:
      elasticsearch:
        host: "ph-ee-elasticsearch"
        clusterName: "ph-ee-elasticsearch"
    ingress:
      enabled: false
      annotations: 
        kubernetes.io/ingress.class: nginx     
      path: /
      host: operate.mifos.gazelle.test
      tls:
        enabled: true

  elasticsearch:
    enabled: true
    #Single Node Solution
    clusterHealthCheckParams: "wait_for_status=yellow&timeout=100s"
    protocol: http
    master:
      readinessProbe:
        httpGet:
          allow-insecure: true
          username: elastic
          password: "{{ .Env.ELASTIC_PASSWORD }}"
          path: /_cluster/health?wait_for_status=yellow&timeout=5s
          port: 9200
        initialDelaySeconds: 30
    data:
      readinessProbe:
        httpGet:
          allow-insecure: true
          username: elastic
          password: "{{ .Env.ELASTIC_PASSWORD }}"
          path: /_cluster/health?wait_for_status=yellow&timeout=5s
          port: 9200
        initialDelaySeconds: 30
    # Shrink default JVM heap.
    esJavaOpts: "-Xmx128m -Xms512m"
    # Allocate smaller chunks of memory per pod.
    resources:
      requests:
        cpu: "100m"
        memory: "128M"
      limits:
        cpu: "1000m"
        memory: "256M"
    volumeClaimTemplate:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 1Gi

  kibana:
    enabled: true
    readinessProbe:
      initialDelaySeconds: 45
      timeoutSeconds: 15
      successThreshold: 1    
    protocol: http
    ingress:
      enabled: false
      className: "nginx"
      pathtype: "Prefix"
      annotations: {
        kubernetes.io/ingress.class: nginx
        # kubernetes.io/tls-acme: "true" 
      }      
      hosts:
        - host: kibana-phee.mifos.gazelle.test
          paths:
            - path: /
      #tls: []
      #  - secretName: chart-example-tls
      #    hosts:
      #      - chart-example.mifos.gazelle.test

  operations:
    enabled: true

  operationsmysql:
    auth:
      database: "tenants"
      username: "mifos"
      password: "password"
      rootPassword: "ethieTieCh8ahv"
    initdbScripts:
      setup.sql: |-
        CREATE DATABASE IF NOT EXISTS FRED2;
        CREATE DATABASE IF NOT EXISTS tenants;
        CREATE DATABASE IF NOT EXISTS phdefault;
        CREATE DATABASE IF NOT EXISTS messagegateway;
        CREATE DATABASE IF NOT EXISTS voucher_management; 
        CREATE DATABASE IF NOT EXISTS identity_account_mapper;
        CREATE DATABASE IF NOT EXISTS greenbank;
        CREATE DATABASE IF NOT EXISTS bluebank;
        GRANT ALL ON *.* TO 'root'@'%';
        GRANT ALL PRIVILEGES ON tenants.* to 'mifos'; 
        GRANT ALL PRIVILEGES ON messagegateway.* TO 'mifos';
        GRANT ALL PRIVILEGES ON phdefault.* TO 'mifos';
        GRANT ALL PRIVILEGES ON voucher_management.* TO 'mifos';
        GRANT ALL PRIVILEGES ON identity_account_mapper.* TO 'mifos';
        GRANT ALL PRIVILEGES ON `greenbank`.* TO 'mifos';
        GRANT ALL PRIVILEGES ON `bluebank`.* TO 'mifos';  

  ph_ee_connector_ams_mifos:
    enabled: true
    SPRING_PROFILES_ACTIVE: "fin12,bb"
    ams_local_enabled: true
    ams_local_interop_host: "https://fineract-server/"
    ams_local_account_host: "https://fineract-server/"
    ams_local_customer_host: "https://fineract-server/"
    ams_local_auth_host: "https://fineract-server/"
    ingress:
      enabled: false
      annotations: 
        kubernetes.io/ingress.class: nginx
      tls:
        - secretName: sandbox-secret
      hosts:
        - host: ams-mifos.mifos.gazelle.test          
          paths: 
          - path: "/"
            backend:
              service:
                name: ph-ee-connector-ams-mifos
                port:
                  number: 80   
    deployment:
      annotations:
        deployTime: "{{ .Values.deployTime }}"

  ph_ee_connector_mojaloop:
    enabled: true
    SPRING_PROFILES_ACTIVE: "bb"
    hostname: "mojaloop.mifos.gazelle.test"
    ingress:
