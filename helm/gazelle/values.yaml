global:
  max_execution_threads: 50
  poll_interval: 10

ph-ee-engine:
  
  channel:
    tenantPrimary:
      clientId: "mifos"
      clientSecret: "password"
      tenant: "greenbank"
    tenantSecondary:
      clientId: "mifos"
      clientSecret: "password"
      tenant: "bluebank"
    server:
      ssl:
        keyPassword: "password"
        keyStorePassword: "password"  
    
  integration_test:
    enabled: true
    gradle:
      command: ./gradlew test -Dcucumber.filter.tags="@gov"

account_mapper:
  enabled: true
  image: docker.io/openmf/ph-ee-identity-account-mapper:v1.6.0-gazelle-1.1.0
  hostname: "identity-mapper.mifos.gazelle.test"
  LOGGING_LEVEL_ROOT: INFO    
  ingress:
    enabled: true
    className: nginx
    pathtype: Prefix
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://ops.mifos.gazelle.test"
      nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE"
      nginx.ingress.kubernetes.io/cors-allow-headers: "x-registering-institution-id, Content-Type, Authorization"
      nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    tls:
    - hosts:
      - identity-mapper.mifos.gazelle.test
      secretName: sandbox-secret
    hosts:
      - host: identity-mapper.mifos.gazelle.test
        paths:
        - path: "/"
          backend:
            service:
              name: "ph-ee-identity-account-mapper"
              port:
                number: 80
  deployment:
    annotations:
      deployTime: "{{ .Values.deployTime }}"
  async:
    core_pool_size: 10
    max_pool_size: 10
    queue_capacity: 100
  account_validation_enabled: "false"
  account_validator_connector: "gsma"
  spring:
    cache:
      time_to_live: 30
      time_to_idle: 30
      max_entries_heap: 1000
      max_byte_off_heap: 10
      max_byte_disk: 10
    datasource:
      url: jdbc:mysql://operationsmysql:3306/identity_account_mapper
      username: mifos
      password: password
 
  
